<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABuddy - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <!-- Left Side - Illustration -->
        <div class="left-side">
            <div class="logo">
                <img src="icon/icon_usus.png" class="logo_usus">
                <div class="logo-text">BABuddy</div>
            </div>
            
            <div class="illustration">
                <img src="icon/icon_babuddy.png" class="logo_babuddy">
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="right-side">
            <div class="login-container">
                <h1>Halo, Selamat Datang!</h1>
                <p class="subtitle">Masuk untuk menggunakan BABuddy</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Alamat Email" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Kata Sandi</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                placeholder="Kata Sandi" 
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <span class="eye-icon" id="eyeIcon">👁️</span>
                            </button>
                        </div>
                        <a href="#" class="forgot-password">Lupa Kata Sandi?</a>
                    </div>

                    <button type="submit" class="btn-login">Masuk</button>
                </form>

                <div class="divider">
                    <span>Atau masuk dengan</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google" id="googleLogin">
                        <img src="icon/icon_google.png">
                    </button>
                </div>

                <div class="register-link">
                    Belum punya akun? <a href="register.html" id="daftarLink">Daftar</a> disini
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
