<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABuddy - Daftar</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="container">
        <!-- Left Side - Illustration -->
        <div class="left-side">
            <div class="logo">
                 <img src="icon/icon_usus.png" class="logo_usus">
                <div class="logo-text">BABuddy</div>
            </div>
            
            <div class="illustration">
                 <img src="icon/icon_babuddy.png" class="logo_babuddy">
            </div>
        </div>

        <!-- Right Side - Register Form -->
        <div class="right-side">
            <div class="register-container">
                <h1>Daftar</h1>

                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="namaDepan">Nama Depan</label>
                            <input 
                                type="text" 
                                id="namaDepan" 
                                placeholder="Masukkan nama depan" 
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="namaBelakang">Nama Belakang</label>
                            <input 
                                type="text" 
                                id="namaBelakang" 
                                placeholder="Masukkan Nama Belakang" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Masukkan Alamat Email" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Kata Sandi</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                placeholder="Buat Kata Sandi" 
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <span class="eye-icon" id="eyeIcon">👁️</span>
                            </button>
                        </div>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="agreeTerms" required>
                            <span class="checkmark"></span>
                            <span class="checkbox-text">
                                I agree to the <a href="#" id="termsLink">Terms of Service</a> and <a href="#" id="privacyLink">Privacy Policy</a>
                            </span>
                        </label>
                    </div>

                    <button type="submit" class="btn-register">Buat Akun</button>
                </form>

                <div class="login-link">
                    Sudah punya akun? <a href="login.html" id="masukLink">Masuk</a> disini
                </div>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
